[package]
name = "omastonk-qs"
version = "2.0.7"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Omarchy Quattro bar widget backend for a rotating market watchlist"
readme = "README.md"
repository = "https://github.com/LucaNerlich/omastonk"
keywords = ["omarchy", "quickshell", "stocks", "market"]
categories = ["command-line-utilities"]

[lib]
name = "omastonk_qs"
path = "src/lib.rs"

[[bin]]
name = "omastonk-qs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
# Keep the symbol table. Marketplace review inspects this ELF with `nm`;
# `strip = true` or `"symbols"` is a listing rejection.
strip = "debuginfo"
