name: Release

# Re-runs the validation on the tagged SHA, packages the plugin, and publishes
# the GitHub Release the Omarchy marketplace consumes. A failed or skipped
# validation must not produce a release asset for that tag.
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  OMARCHY_REF: v4.0.0

jobs:
  release:
    name: validate and publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq qt6-declarative-dev-tools

      - name: Validate manifest (omarchy plugin validate)
        run: scripts/validate-plugin.sh

      - name: Prepare QML import stubs
        run: |
          set -euo pipefail
          mkdir -p qml-imports/Quickshell/Io qml-imports/Quickshell/Wayland qml-imports/Quickshell/Hyprland qml-imports/qs

          printf 'module Quickshell\n' > qml-imports/Quickshell/qmldir
          printf 'import QtQuick\nItem {}\n' > qml-imports/Quickshell/Quickshell.qml
          printf 'module Quickshell.Io\n' > qml-imports/Quickshell/Io/qmldir
          printf 'import QtQuick\nItem {}\n' > qml-imports/Quickshell/Io/Io.qml
          printf 'module Quickshell.Wayland\n' > qml-imports/Quickshell/Wayland/qmldir
          printf 'import QtQuick\nItem {}\n' > qml-imports/Quickshell/Wayland/Wayland.qml
          printf 'module Quickshell.Hyprland\n' > qml-imports/Quickshell/Hyprland/qmldir
          printf 'import QtQuick\nItem {}\n' > qml-imports/Quickshell/Hyprland/Hyprland.qml

          curl -fsSL "https://github.com/basecamp/omarchy/archive/refs/tags/${OMARCHY_REF}.tar.gz" -o /tmp/omarchy.tar.gz
          mkdir -p /tmp/omarchy-shell
          tar -xzf /tmp/omarchy.tar.gz -C /tmp/omarchy-shell --strip-components=2 "omarchy-${OMARCHY_REF#v}/shell"
          mv /tmp/omarchy-shell/Commons qml-imports/qs/Commons
          mv /tmp/omarchy-shell/Ui qml-imports/qs/Ui

      - name: Lint QML
        run: |
          set -euo pipefail
          QMLLINT="$(command -v qmllint-qt6 || command -v qmllint || echo /usr/lib/qt6/bin/qmllint)"
          QML2_IMPORT_PATH="$PWD/qml-imports" "$QMLLINT" -I "$PWD/qml-imports" BarWidget.qml Panel.qml

      - name: Package plugin
        run: scripts/package-release.sh

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          plugin_id="$(jq -r '.id' manifest.json)"
          asset="dist/${plugin_id}-${version}.tar.gz"
          notes="$(scripts/changelog-notes.sh "$version")"
          {
            echo "$notes"
            echo
            echo "Artifact: \`$(basename "$asset")\`"
          } > /tmp/release-notes.md
          gh release create "$tag" "$asset" --title "$tag" --notes-file /tmp/release-notes.md
