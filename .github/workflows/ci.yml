name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OMARCHY_REF: v4.0.0

jobs:
  linux:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      # Pinned to actions/checkout v4.4.0.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # Match rust-toolchain.toml. `@stable` installs clippy/rustfmt on the
      # `stable` toolchain name, but the pin overrides cargo to `1.97.1`, which
      # then fails `cargo fmt` with "cargo-fmt is not installed".
      # Pinned to dtolnay/rust-toolchain branch 1.97.1 @ 032958a.
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          components: clippy, rustfmt

      # Pinned to Swatinem/rust-cache v2.
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Plugin model tests
        run: node omarchy/model.test.mjs

  msrv:
    name: test (rust 1.97.1)
    runs-on: ubuntu-latest
    steps:
      # Pinned to actions/checkout v4.4.0.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # Pinned to dtolnay/rust-toolchain branch 1.97.1 @ 032958a.
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5

      # Pinned to Swatinem/rust-cache v2.
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          key: msrv-1.97.1

      - name: Check declared minimum Rust version
        run: cargo check --all-targets --locked

  # Independent of linux/msrv: marketplace review needs this job to run even
  # if a prerequisite such as rustfmt is missing. A skipped verify cannot
  # attest that the bundled ELF matches the reviewed source. Do not add
  # `needs:` here. The tag Release workflow re-runs the same script.
  verify-bundle:
    name: marketplace bundle (inspectable, reproducible)
    runs-on: ubuntu-latest
    steps:
      # Pinned to actions/checkout v4.4.0.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # Inspect before installing the pinned toolchain so a rustup failure
      # cannot skip the non-stripped / recorded-hash / source-id attestation.
      # The source-id check catches a leftover ELF after a comment-only Rust
      # edit without waiting for the musl rebuild.
      - name: Inspect committed ELF
        run: VERIFY_BUNDLE_SKIP_REBUILD=1 scripts/verify-bundle.sh

      # Keep a musl-capable linker available for any future dependency that
      # compiles C; the current crate is pure Rust.
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Pin to the toolchain in rust-toolchain.toml so the check reproduces
      # the exact binary that was committed.
      # Pinned to dtolnay/rust-toolchain branch 1.97.1 @ 032958a.
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          targets: x86_64-unknown-linux-musl

      # Pinned to Swatinem/rust-cache v2.
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          key: verify-bundle-musl

      - name: Rebuild and compare byte-for-byte
        run: scripts/verify-bundle.sh
